<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nová zpráva | Knihovna</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="navbar-container">

        <a href="dashboard.html" class="navbar-brand">
            📚 Knihovna
        </a>

        <ul class="navbar-menu">
            <li>
                <a href="#">Knihy</a>
            </li>

            <li>
                <a href="#">Rezervace</a>
            </li>

            <li>
                <a href="inbox.html">Zprávy</a>
            </li>

            <li>
                <a href="books.html">Administrace</a>
            </li>

            <li>
                <a href="dashboard.html">Dashboard</a>
            </li>

            <li>
                <a href="#">Profil</a>
            </li>

            <li>
                <a href="#">Odhlásit</a>
            </li>
        </ul>

    </div>
</nav>


<!-- HLAVNÍ OBSAH -->
<main>

    <div class="container">

        <h1 class="page-title">
            Nová zpráva
        </h1>


        <!-- NAVIGACE ZPRÁV -->
        <div class="message-navigation">

            <a
                href="inbox.html"
                class="btn btn-secondary"
            >
                Přijaté zprávy
            </a>

            <a
                href="sent.html"
                class="btn btn-secondary"
            >
                Odeslané zprávy
            </a>

            <a
                href="new.html"
                class="btn btn-success"
            >
                + Nová zpráva
            </a>

        </div>


        <!-- FORMULÁŘ -->
        <div class="card">

            <h2>Napsat zprávu</h2>

            <form>

                <!-- PŘÍJEMCE -->
                <div class="form-group">

                    <label for="recipient">
                        Příjemce
                    </label>

                    <select
                        id="recipient"
                        name="recipient"
                        class="form-control"
                    >

                        <option value="">
                            Vyberte příjemce
                        </option>

                        <!-- Uživatel může napsat administrátorovi -->
                        <option value="admin">
                            Administrátor
                        </option>

                        <!-- Testovací uživatelé pro administrátora -->
                        <option value="jan">
                            Jan Novák
                        </option>

                        <option value="eva">
                            Eva Malá
                        </option>

                        <option value="petr">
                            Petr Svoboda
                        </option>

                    </select>

                </div>


                <!-- PŘEDMĚT -->
                <div class="form-group">

                    <label for="subject">
                        Předmět
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        class="form-control"
                        placeholder="Zadejte předmět zprávy"
                    >

                </div>


                <!-- TEXT ZPRÁVY -->
                <div class="form-group">

                    <label for="message">
                        Zpráva
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        class="form-control"
                        rows="7"
                        placeholder="Napište zprávu..."
                    ></textarea>

                </div>


                <!-- TLAČÍTKO -->
                <button
                    type="button"
                    class="btn btn-primary"
                >
                    Odeslat zprávu
                </button>

            </form>

        </div>

    </div>

</main>

</body>

</html>
