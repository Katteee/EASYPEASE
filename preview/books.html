<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrace knih | Knihovna</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<nav class="navbar">
    <div class="navbar-container">

        <a href="dashboard.html" class="navbar-brand">📚 Knihovna</a>

        <ul class="navbar-menu">
            <li><a href="#">Knihy</a></li>
            <li><a href="#">Rezervace</a></li>
            <li><a href="inbox.html">Zprávy</a></li>
            <li><a href="books.html">Administrace</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="#">Profil</a></li>
            <li><a href="#">Odhlásit</a></li>
        </ul>

    </div>
</nav>

<main>
    <div class="container">

        <h1 class="page-title">Administrace knih</h1>

        <div class="card">

            <h2>Seznam knih</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Název</th>
                        <th>Autor</th>
                        <th>ISBN</th>
                        <th>Žánr</th>
                        <th>Počet kusů</th>
                        <th>Akce</th>
                    </tr>
                </thead>

                <tbody>

                    <tr>
                        <td>1</td>
                        <td>1984</td>
                        <td>George Orwell</td>
                        <td>9780451524935</td>
                        <td>Román</td>
                        <td>5</td>
                        <td>
                            <button class="btn btn-primary">
                                Upravit
                            </button>

                            <button class="btn btn-danger">
                                Odstranit
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>2</td>
                        <td>Malý princ</td>
                        <td>Antoine de Saint-Exupéry</td>
                        <td>9780156012195</td>
                        <td>Próza</td>
                        <td>3</td>
                        <td>
                            <button class="btn btn-primary">
                                Upravit
                            </button>

                            <button class="btn btn-danger">
                                Odstranit
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>


        <div class="card">

            <h2>Přidat novou knihu</h2>

            <form>

                <div class="form-group">
                    <label>Název knihy</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Zadejte název knihy"
                    >
                </div>

                <div class="form-group">
                    <label>Autor</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Zadejte autora"
                    >
                </div>

                <div class="form-group">
                    <label>ISBN</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Zadejte ISBN"
                    >
                </div>

                <div class="form-group">
                    <label>Žánr</label>
                    <input
                        type="text"
                        class="form-control"
                        placeholder="Zadejte žánr"
                    >
                </div>

                <div class="form-group">
                    <label>Rok vydání</label>
                    <input
                        type="number"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label>Počet kusů</label>
                    <input
                        type="number"
                        class="form-control"
                    >
                </div>

                <div class="form-group">
                    <label>Popis</label>
                    <textarea
                        class="form-control"
                        rows="5"
                        placeholder="Zadejte popis knihy"
                    ></textarea>
                </div>

                <button
                    type="button"
                    class="btn btn-success"
                >
                    Uložit knihu
                </button>

            </form>

        </div>

    </div>
</main>

</body>
</html>
